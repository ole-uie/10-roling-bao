version: 2
models:
  # --- Dimensiones: cada valor una sola vez y nunca vacío ---
  - name: dim_cocinero
    columns:
      - name: cocinero
        data_tests: [unique, not_null]

  - name: dim_food_truck
    columns:
      - name: food_truck
        data_tests: [unique, not_null]

  - name: dim_festival
    columns:
      - name: festival
        data_tests: [unique, not_null]

  # --- Hecho: un turno por fila y cada clave existe en su dimensión ---
  - name: fact_turnos
    columns:
      - name: turno
        data_tests: [unique, not_null]
      - name: cocinero
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_cocinero')
                field: cocinero
      - name: food_truck
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_food_truck')
                field: food_truck
      - name: festival
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_festival')
                field: festival
  # --- Historia (Jornada 7): cada modelo, su columna que identifica la fila ---
  - name: historia_terreno
    columns:
      - name: turnos
        data_tests: [not_null]

  - name: historia_semanas
    columns:
      - name: semana
        data_tests: [unique, not_null]

  - name: historia_turnos
    columns:
      - name: turno
        data_tests: [unique, not_null]

  - name: historia_rentabilidad
    description: "Margen por festival: ingreso − ingredientes (supuesto 6 €/kg) − mano de obra (supuesto 5 min por ración a 9,55 €/h brutos × 1,33 de Seguridad Social de empresa = 12,70 €/h)."
    columns:
      - name: festival
        data_tests: [unique, not_null]

  - name: historia_precio_objetivo
    description: "Precio de la ración en Fiesta Universitaria para ganar la mediana del margen de los otros siete festivales, con las mismas raciones o con un 20 % menos."
    columns:
      - name: escenario
        data_tests: [unique, not_null]

  - name: historia_margen_semana
    description: "Margen total por festival y semana (mismos supuestos de coste que historia_rentabilidad)."
    columns:
      - name: celda
        data_tests: [unique, not_null]

  - name: historia_contraste
    columns:
      - name: festival
        data_tests: [unique, not_null]
